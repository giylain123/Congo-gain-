<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONGO-GAIN - Paris Sportifs Congo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding-bottom:90px}
header{background:#000;padding:12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ffcc00}
header img{width:90px;height:90px;object-fit:contain;border-radius:50%;background:#fff}
header h1{margin:5px 0 0;font-size:22px;color:#ffcc00;letter-spacing:1px}
header p{margin:2px;font-size:12px;color:#ccc}
.top{display:flex;gap:10px;padding:10px}
.card{background:#1a2340;border-radius:12px;padding:14px;flex:1;text-align:center}
.card small{color:#aaa}.card b{font-size:20px;color:#ffcc00}
.btn{border:none;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;width:100%}
.btn-yellow{background:#ffcc00;color:#000}.btn-green{background:#00c853;color:#fff}.btn-red{background:#ff3d00;color:#fff}.btn-dark{background:#2a345a;color:#fff}
.tabs{display:flex;gap:8px;padding:0 10px;overflow:auto}
.tabs button{flex:1;min-width:80px;padding:10px;border:none;border-radius:20px;background:#2a345a;color:#fff;font-weight:bold}
.tabs button.active{background:#ffcc00;color:#000}
.section{padding:10px}
.match{background:#fff;color:#000;border-radius:12px;padding:14px;margin-bottom:10px}
.match h3{margin:0;font-size:15px}.match p{margin:4px 0;color:#666;font-size:12px}
.live{color:#ff3d00;font-weight:bold;font-size:12px}
.cotes{display:flex;gap:8px;margin-top:10px}
.cotes button{flex:1;padding:12px;border:none;border-radius:8px;background:#0a0f1e;color:#fff;font-weight:bold;font-size:15px}
.cotes button.sel{background:#ffcc00;color:#000}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0a0f1e;color:#fff;margin:6px 0}
.coupon{position:fixed;bottom:0;left:0;right:0;background:#ffcc00;color:#000;padding:12px;border-radius:15px 15px 0 0;display:none}
.coupon b{font-size:16px}
.casino-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:#1a2340;border-radius:12px;padding:16px;text-align:center;font-size:18px;cursor:pointer;border:1px solid #333}
.game span{font-size:32px;display:block}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:15px}
.modal>div{background:#1a2340;border-radius:15px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
#aviatorBox{background:#000;border-radius:12px;padding:20px;text-align:center;font-size:42px;font-weight:bold;color:#ffcc00}
</style>
</head>
<body>

<header>
<img src="logo.png" onerror="this.src='https://via.placeholder.com/90x90?text=CG'">
<h1>🇨🇬 CONGO-GAIN</h1>
<p>Paris Sportifs - Brazzaville | Pointe-Noire</p>
</header>

<div class="top">
<div class="card"><small>Ton Solde</small><br><b id="solde">0 FCFA</b></div>
<div class="card"><small>Gain Total</small><br><b id="gainTotal" style="color:#00c853">0 FCFA</b></div>
</div>

<div class="top" style="padding-top:0">
<button class="btn btn-green" onclick="openModal('depotModal')">+ RE
